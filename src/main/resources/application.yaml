spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasksq}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1212}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiracao: ${JWT_EXPIRACAO:1}
