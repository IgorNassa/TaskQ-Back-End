spring:
  application:
    name: tasksq-back-end

  datasource:
    url: jdbc:postgresql://localhost:5432/tasksq
    username: postgres
    password: 1212
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration